version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Give a compromised release time to be noticed and pulled before we adopt it.
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
    ignore:
      # v2 needs @changesets/cli v3; drop this when package.json moves to v3.
      - dependency-name: changesets/action
        update-types: ["version-update:semver-major"]
