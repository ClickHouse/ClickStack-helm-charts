name: Helm Chart Tests

on:
  push:
    branches: [ main ]
    paths:
      - 'charts/**'
      - 'examples/**'
      - 'Makefile'
      - 'scripts/**'
      - '.githooks/**'
      - '.github/workflows/helm-test.yaml'
  # No paths filter: helm-unittest is a required check, and a filtered-out PR would never report it.
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  version-script-smoke:
    # The release scripts (update-chart-versions.js, extract-release-notes.js)
    # otherwise only run post-merge in release.yml; exercise them at PR time so
    # dependency bumps (e.g. js-yaml) can't break chart releases silently.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js 20
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20

      - name: Enable Corepack
        run: corepack enable

      - name: Install Dependencies
        run: yarn

      - name: Run update-chart-versions script
        run: |
          node scripts/update-chart-versions.js
          # shellcheck disable=SC2016 # the node script is single-quoted on purpose
          # Verify the yaml round-trip produced a valid Chart.yaml with the
          # version from package.json.
          node -e '
            const fs = require("fs");
            const yaml = require("js-yaml");
            const { version } = require("./package.json");
            const chart = yaml.load(fs.readFileSync("charts/clickstack/Chart.yaml", "utf8"));
            if (chart.version !== version) {
              console.error(`Chart.yaml version ${chart.version} != package.json version ${version}`);
              process.exit(1);
            }
            console.log(`Chart.yaml round-trip OK (version ${chart.version})`);
          '
          git checkout -- charts/*/Chart.yaml

      - name: Run extract-release-notes script
        run: |
          node scripts/extract-release-notes.js
          # Discard the generated release notes file, if any.
          rm -f charts/clickstack/RELEASE_NOTES.md

  helm-unittest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.12.0

      - name: Install tools, run unit tests, verify docs
        run: make ci-setup test docs-check

  helmcov:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.12.0

      - name: Build chart dependencies
        run: make chart-deps

      - name: Load pinned helmcov version and thresholds
        run: grep -E '^(HELMCOV_VERSION|COVERAGE_THRESHOLD|BRANCH_COVERAGE_THRESHOLD)=' scripts/tool-versions.env >> "$GITHUB_ENV"

      - name: Run helmcov
        uses: ClickHouse/helmcov@7b1852d4cb6e140515272fe362c81684a7640e46 # v0.7.0
        with:
          chart: charts/clickstack
          tests: charts/clickstack/tests
          threshold: ${{ env.COVERAGE_THRESHOLD }}
          branch-threshold: ${{ env.BRANCH_COVERAGE_THRESHOLD }}
          version: ${{ env.HELMCOV_VERSION }}
          # Fork PRs get a read-only token, so posting the comment would 403 and fail the job.
          comment: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
