name: Release Helm Charts
on:
  workflow_run: # zizmor: ignore[dangerous-triggers] the release job only runs for pushes to main
    workflows: ["Helm Chart Tests", "Helm Chart Integration Test"]
    types:
      - completed
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  packages: write
  pull-requests: write
jobs:
  release:
    runs-on: ubuntu-latest
    # Only release for pushes to main; a fork PR from a branch named main also matches the branches filter.
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          # changesets writes its own ~/.netrc and chart-releaser pushes with CR_TOKEN, so keep the token out of .git/config while yarn runs.
          persist-credentials: false
      - name: Configure Git user
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
      - name: Setup Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - name: Enable Corepack
        run: corepack enable
      - name: Install Dependencies
        run: yarn
      - name: Create Release Pull Request
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          commit: 'chore(release): bump version'
          title: 'Release ClickStack Helm Charts'
          version: yarn run version
          publish: yarn run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate release notes from CHANGELOG.md
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: node scripts/extract-release-notes.js
      - name: Run chart-releaser job
        if: steps.changesets.outputs.hasChangesets == 'false'
        uses: helm/chart-releaser-action@cae68fefc6b5f367a0275617c9f83181ba54714f # v1.7.0
        with:
          skip_existing: true
          config: .github/cr.yaml
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
      - name: Push charts to GHCR
        if: steps.changesets.outputs.hasChangesets == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OCI_REPO: oci://ghcr.io/clickhouse/charts
        run: |
          echo "$GH_TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          pkgs=$(mktemp -d)
          # Push the GitHub release asset, not a fresh package, so GHCR serves the same bytes as the Pages repo.
          for chart in charts/*/Chart.yaml; do
            read -r name version < <(yq '.name + " " + .version' "$chart")
            tag="$name-$version"
            if ! gh release view "$tag" >/dev/null 2>&1; then
              echo "$tag has no GitHub release, skipping"
            elif helm show chart "$OCI_REPO/$name" --version "$version" >/dev/null 2>&1; then
              echo "$tag already in $OCI_REPO, skipping"
            else
              gh release download "$tag" -p "$tag.tgz" -D "$pkgs"
              helm push "$pkgs/$tag.tgz" "$OCI_REPO"
            fi
          done
