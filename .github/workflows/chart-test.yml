name: Helm Chart Integration Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      suites: ${{ steps.find.outputs.suites }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Discover test suites
        id: find
        run: |
          SUITES=$(for f in integration-tests/*/suite.yaml; do basename "$(dirname "$f")"; done \
            | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "suites=$SUITES" >> "$GITHUB_OUTPUT"
          echo "Discovered suites: $SUITES"

  integration-test:
    name: integration-test (${{ matrix.suite }}${{ matrix.mode == 'upgrade' && ', upgrade' || '' }})
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJson(needs.discover.outputs.suites) }}
        # PRs also upgrade from the base branch, to catch changes that only break existing releases.
        mode: ${{ github.event_name == 'pull_request' && fromJson('["install","upgrade"]') || fromJson('["install"]') }}
    env:
      SUITE: ${{ matrix.suite }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout base branch
        if: matrix.mode == 'upgrade'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .upgrade-base
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: "3.12.0"

      - name: Install helm-diff
        if: matrix.mode == 'upgrade'
        # The diff is for reviewers; without the plugin run-suite.sh skips it and still tests the upgrade.
        continue-on-error: true
        # v3.13+ needs a newer Helm than the 3.12 pinned above.
        run: helm plugin install https://github.com/databus23/helm-diff --version v3.12.5

      - name: Update appVersion for nightly builds
        if: github.event_name == 'schedule'
        run: |
          echo "Updating appVersion to 2-nightly for scheduled builds"
          sed -i 's/^appVersion:.*/appVersion: 2-nightly/' charts/clickstack/Chart.yaml

      - name: Read suite config
        id: config
        run: |
          NEEDS_NODEJS=$(yq '.needs_nodejs // false' "integration-tests/$SUITE/suite.yaml")
          echo "needs_nodejs=$NEEDS_NODEJS" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        if: steps.config.outputs.needs_nodejs == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Run integration test suite
        env:
          UPGRADE_FROM: ${{ matrix.mode == 'upgrade' && format('{0}/.upgrade-base', github.workspace) || '' }}
        run: |
          chmod +x integration-tests/run-suite.sh
          integration-tests/run-suite.sh "$SUITE"

      - name: Collect logs on failure
        if: failure()
        run: |
          echo "=== Pod Status ==="
          kubectl get pods -o wide || true

          echo "=== Events ==="
          kubectl get events --sort-by=.metadata.creationTimestamp || true

          echo "=== All Pod Logs ==="
          for pod in $(kubectl get pods -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
            echo "--- Logs for $pod ---"
            kubectl logs "$pod" --all-containers --tail=200 || true
          done

          echo "=== All Resources ==="
          kubectl get deployment,svc,hpa,networkpolicy,sa,ingress,secret -o wide || true

          echo "=== Pod Descriptions ==="
          kubectl describe pods || true

      - name: Cleanup
        if: always()
        run: |
          helm uninstall "test-$SUITE" || true
          kind delete cluster --name "test-$SUITE" || true

  otel-cicd-action:
    # Only run when secrets are available. Fork PRs (external contributors) do
    # not receive repository secrets, so OTLP_ENDPOINT is empty and the export
    # action fails with "Name resolution failed for target dns:v1". Skip the job
    # on fork PRs and run it for same-repo events (push, internal PRs, schedule).
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    name: OpenTelemetry Export Trace
    runs-on: ubuntu-latest
    needs: [integration-test]
    permissions:
      contents: read
      actions: read
      pull-requests: read
      checks: read
    env:
      OTLP_ENDPOINT: ${{ secrets.OTLP_ENDPOINT }}
    steps:
      - name: Export workflow
        # Defense-in-depth: skip if the endpoint secret is unset even on
        # same-repo runs, so an empty endpoint never reaches the action.
        if: ${{ env.OTLP_ENDPOINT != '' }}
        uses: corentinmusard/otel-cicd-action@4826b79d63662fa91657272e7711420cb6aea543 # v4.2.0
        with:
          otlpEndpoint: ${{ secrets.OTLP_ENDPOINT }}/v1/traces
          otlpHeaders: ${{ secrets.OTLP_HEADERS }}
          otelServiceName: "clickstack-helm-chart-integration-test"
          githubToken: ${{ secrets.GITHUB_TOKEN }}
