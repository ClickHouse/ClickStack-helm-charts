name: Update App Version

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to update appVersion to'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  update-app-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          # The tag lands in sed expressions and a file name, so only allow version-like characters.
          [[ "$TAG" =~ ^[0-9A-Za-z._-]+$ ]] || { echo "::error::invalid tag: $TAG"; exit 1; }

      - name: Update appVersion in Chart.yaml
        env:
          TAG: ${{ inputs.tag }}
        run: |
          sed -i "s/^appVersion: .*/appVersion: $TAG/" charts/clickstack/Chart.yaml

      - name: Update otel-collector image tag in values.yaml
        env:
          TAG: ${{ inputs.tag }}
        run: |
          sed -i "/clickstack-otel-collector/{n;s/tag: \"[^\"]*\"/tag: \"$TAG\"/}" charts/clickstack/values.yaml

      - name: Regenerate chart README
        run: make docs

      - name: Create changeset
        env:
          TAG: ${{ inputs.tag }}
        run: |
          mkdir -p .changeset
          cat > ".changeset/update-app-version-$TAG.md" << EOF
          ---
          "helm-charts": patch
          ---

          chore: update appVersion to $TAG
          EOF

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: Update appVersion to ${{ github.event.inputs.tag }}"
          title: "Update appVersion to ${{ github.event.inputs.tag }}"
          body: |
            This PR updates the appVersion in Chart.yaml to `${{ github.event.inputs.tag }}` and aligns the otel-collector image tag in values.yaml.
            
            - Updated `charts/clickstack/Chart.yaml`
            - Updated `otel-collector.image.tag` in `charts/clickstack/values.yaml`
            - Regenerated `charts/clickstack/README.md`
          branch: update-app-version-${{ github.event.inputs.tag }}
          delete-branch: true
