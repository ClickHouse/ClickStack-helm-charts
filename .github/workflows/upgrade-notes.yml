name: Upgrade Notes

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  upgrade-notes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check docs/UPGRADE.md covers the changesets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: scripts/check-upgrade-notes.sh "$BASE_SHA"
