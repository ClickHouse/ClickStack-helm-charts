name: Upgrade Notes

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  upgrade-notes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check docs/UPGRADE.md covers the changesets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: scripts/check-upgrade-notes.sh "$BASE_SHA"
