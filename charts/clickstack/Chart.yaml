apiVersion: v2
name: clickstack
description: >-
  A Helm chart for ClickStack - Full-stack observability with ClickHouse,
  OpenTelemetry, and HyperDX
home: https://clickhouse.com/docs/use-cases/observability/clickstack
icon: https://raw.githubusercontent.com/ClickHouse/ClickStack/main/packages/app/public/favicons/clickstack/favicon.svg
sources:
  - https://github.com/ClickHouse/ClickStack-helm-charts
  - https://github.com/ClickHouse/ClickStack
keywords:
  - observability
  - opentelemetry
  - clickhouse
  - logs
  - traces
  - metrics
annotations:
  artifacthub.io/category: monitoring-logging
  artifacthub.io/license: MIT
  artifacthub.io/links: |
    - name: Chart Source
      url: https://github.com/ClickHouse/ClickStack-helm-charts
    - name: Upstream Project
      url: https://github.com/ClickHouse/ClickStack
    - name: Upgrade Guide
      url: https://github.com/ClickHouse/ClickStack-helm-charts/blob/main/docs/UPGRADE.md
type: application
version: 3.8.1
appVersion: 2.47.0
dependencies:
  - name: opentelemetry-collector
    version: ~0.146.0
    repository: oci://ghcr.io/open-telemetry/opentelemetry-helm-charts
    alias: otel-collector
    condition: otel-collector.enabled
