{{- include "clickstack.normalizeValues" . -}}
{{- if .Values.clickstack.tasks.enabled }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "clickstack.fullname" . }}-check-alerts
  labels:
    {{- include "clickstack.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.clickstack.tasks.checkAlerts.schedule | quote }}
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            {{- include "clickstack.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: task
        spec:
          {{- if .Values.global.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml .Values.global.imagePullSecrets | nindent 12 }}
          {{- end }}
          {{- with .Values.clickstack.deployment.podSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          restartPolicy: OnFailure
          containers:
            - name: task
              image: "{{ .Values.clickstack.deployment.image.repository }}:{{ .Values.clickstack.deployment.image.tag | default .Chart.AppVersion }}"
              imagePullPolicy: {{ .Values.clickstack.deployment.image.pullPolicy }}
              {{- with .Values.clickstack.deployment.containerSecurityContext }}
              securityContext:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              {{- $tag := .Values.clickstack.deployment.image.tag | default .Chart.AppVersion -}}
              {{- $semver := regexMatch "^[0-9]+\\.[0-9]+\\.[0-9]+" $tag -}}
              {{- if and $semver (semverCompare "< 2.7.0" $tag) }}
              command:
                - "node"
                - "/app/packages/api/tasks/index"
                - "check-alerts"
                {{- range $key, $value := .Values.clickstack.tasks.checkAlerts.additionalArgs }}
                - "--{{ $key }}"
                - "{{ $value }}"
                {{- end }}
              {{- else if and $semver (semverCompare "< 2.22.0" $tag) }}
              command:
                - "node"
                - "/app/packages/api/build/tasks/index.js"
                - "check-alerts"
                {{- range $key, $value := .Values.clickstack.tasks.checkAlerts.additionalArgs }}
                - "--{{ $key }}"
                - "{{ $value }}"
                {{- end }}
              {{- else }}
              # bin/hyperdx loads the image's own self-telemetry preload
              command:
                - "/app/packages/api/bin/hyperdx"
                - "task"
                - "check-alerts"
                {{- range $key, $value := .Values.clickstack.tasks.checkAlerts.additionalArgs }}
                - "--{{ $key }}"
                - "{{ $value }}"
                {{- end }}
              {{- end }}
              envFrom:
                - configMapRef:
                    name: clickstack-config
                - secretRef:
                    name: clickstack-secret
              env:
                - name: NODE_ENV
                  value: "production"
                - name: OTEL_SERVICE_NAME
                  value: "hdx-oss-task-check-alerts"
                - name: APP_TYPE
                  value: "scheduled-task"
              resources:
                {{- toYaml .Values.clickstack.tasks.checkAlerts.resources | nindent 16 }}
{{- end }}
