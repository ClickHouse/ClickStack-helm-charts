{{- include "clickstack.normalizeValues" . -}}
{{- if .Values.clickstack.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "clickstack.hyperdx.serviceAccountName" . }}
  labels:
    {{- include "clickstack.labels" . | nindent 4 }}
  {{- with .Values.clickstack.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
