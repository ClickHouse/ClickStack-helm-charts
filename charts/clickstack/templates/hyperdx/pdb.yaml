{{- if .Values.hyperdx.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "clickstack.fullname" . }}-pdb
  labels:
    {{- include "clickstack.labels" . | nindent 4 }}
    app: {{ include "clickstack.fullname" . }}
    {{- if .Values.hyperdx.deployment.labels }}
    {{- with .Values.hyperdx.deployment.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end -}}
    {{- end }}
spec:
  {{- with .Values.hyperdx.podDisruptionBudget.minAvailable }}
  minAvailable: {{ . }}
  {{- else }}
  {{- /* Unlike minAvailable: 1, this still lets a single replica be evicted, so node drains finish. */}}
  maxUnavailable: {{ .Values.hyperdx.podDisruptionBudget.maxUnavailable | default 1 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "clickstack.selectorLabels" . | nindent 6 }}
      app: {{ include "clickstack.fullname" . }}
{{- end }}
