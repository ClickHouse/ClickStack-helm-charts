{{- include "clickstack.normalizeValues" . -}}
{{- if and (default (dict) .Values.clickstack.dashboards).enabled (eq (include "clickstack.hyperdx.dashboardsRbacCreate" .) "true") }}
{{- $fullname := include "clickstack.fullname" . -}}
{{- $saName := include "clickstack.hyperdx.serviceAccountName" . -}}
{{- /* Cluster-scoped objects are namespace-qualified so two same-named releases don't collide. RBAC names allow 253 chars (not 63), so the qualifier always survives. */}}
{{- $clusterName := printf "%s-%s-dashboard-provisioner" $fullname .Release.Namespace | trunc 253 | trimSuffix "-" -}}
{{- if eq (include "clickstack.hyperdx.dashboardsClusterWide" .) "true" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $clusterName }}
  labels:
    {{- include "clickstack.labels" . | nindent 4 }}
rules:
  {{- include "clickstack.hyperdx.dashboardRbacRules" . | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $clusterName }}
  labels:
    {{- include "clickstack.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $clusterName }}
subjects:
  - kind: ServiceAccount
    name: {{ $saName }}
    namespace: {{ .Release.Namespace }}
{{- else if eq (include "clickstack.hyperdx.dashboardsCrossNamespace" .) "true" }}
{{- /* Scoped cross-namespace discovery (effective set spans >1 namespace): one ClusterRole as a rule template, bound per namespace via RoleBindings so read access never becomes cluster-wide. */}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $clusterName }}
  labels:
    {{- include "clickstack.labels" . | nindent 4 }}
rules:
  {{- include "clickstack.hyperdx.dashboardRbacRules" . | nindent 2 }}
{{- range $ns := (include "clickstack.hyperdx.effectiveNamespaces" . | splitList ",") }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $clusterName }}
  namespace: {{ $ns }}
  labels:
    {{- include "clickstack.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $clusterName }}
subjects:
  - kind: ServiceAccount
    name: {{ $saName }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- else }}
{{- /* Default: discovery scoped to the release namespace only — a namespaced Role, no cluster-scoped objects. With includeReleaseNamespace: false, the same namespaced Role + RoleBinding pair is rendered in each target namespace instead, and nothing in the release namespace. Outside the release namespace the names are namespace-qualified like the cluster-scoped objects above, so two same-named releases can't collide in a shared target namespace, and carry a -scoped suffix so they never reuse the name of the cross-namespace path's RoleBinding (roleRef ClusterRole) in that namespace: roleRef is immutable, so flipping includeReleaseNamespace on an existing install would otherwise fail the upgrade. The suffix always survives: $clusterName is at most 149 characters (fullname and namespace are at most 63 each), well under the 253 RBAC names allow. */}}
{{- range $i, $ns := (include "clickstack.hyperdx.effectiveNamespaces" . | splitList ",") }}
{{- $name := ternary (printf "%s-dashboard-provisioner" $fullname) (printf "%s-scoped" $clusterName) (eq $ns $.Release.Namespace) }}
{{- if $i }}
---
{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    {{- include "clickstack.labels" $ | nindent 4 }}
rules:
  {{- include "clickstack.hyperdx.dashboardRbacRules" $ | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    {{- include "clickstack.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $saName }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
{{- end }}
