suite: Test HyperDX App PodDisruptionBudget
templates:
  - hyperdx/pdb.yaml
tests:
  - it: should default to maxUnavailable 1 so a single replica can still be drained
    set:
      hyperdx:
        podDisruptionBudget:
          enabled: true
    asserts:
      - isKind:
          of: PodDisruptionBudget
      - equal:
          path: spec.maxUnavailable
          value: 1
      - notExists:
          path: spec.minAvailable
      - matchRegex:
          path: metadata.name
          pattern: -pdb$

  - it: should use minAvailable instead when specified
    set:
      hyperdx:
        podDisruptionBudget:
          enabled: true
          minAvailable: 5
    asserts:
      - equal:
          path: spec.minAvailable
          value: 5
      - notExists:
          path: spec.maxUnavailable

  - it: should override maxUnavailable when specified
    set:
      hyperdx:
        podDisruptionBudget:
          enabled: true
          maxUnavailable: 2
    asserts:
      - equal:
          path: spec.maxUnavailable
          value: 2
