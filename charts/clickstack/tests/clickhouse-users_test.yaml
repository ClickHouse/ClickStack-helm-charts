suite: Test ClickHouse Users Configuration
templates:
  - clickhouse/cluster.yaml

tests:
  - it: should include app user in extraUsersConfig
    asserts:
      - isNotNull:
          path: spec.settings.extraUsersConfig.users.app
      - equal:
          path: spec.settings.extraUsersConfig.users.app.profile
          value: default

  # The prometheus_api_v1 handler reads through the timeSeriesSelector() table function,
  # and ClickHouse requires CREATE TEMPORARY TABLE to use any table function.
  - it: should grant the app user CREATE TEMPORARY TABLE for PromQL queries
    asserts:
      - matchRegex:
          path: spec.settings.extraUsersConfig.users.app.grants.query[0]
          pattern: CREATE TEMPORARY TABLE ON \*\.\*

  - it: should include otelcollector user in extraUsersConfig
    asserts:
      - isNotNull:
          path: spec.settings.extraUsersConfig.users.otelcollector
      - equal:
          path: spec.settings.extraUsersConfig.users.otelcollector.profile
          value: default

  - it: should resolve password template expressions from clickstack.secrets
    set:
      clickstack:
        secrets:
          CLICKHOUSE_APP_PASSWORD: "test-app-pass"
          CLICKHOUSE_PASSWORD: "test-otel-pass"
    asserts:
      - equal:
          path: spec.settings.extraUsersConfig.users.app.password
          value: "test-app-pass"
      - equal:
          path: spec.settings.extraUsersConfig.users.otelcollector.password
          value: "test-otel-pass"

  # A YAML list of grants becomes repeated <grants> elements, and ClickHouse reads only the first.
  - it: should render a list of grants as one grants block with every query
    set:
      clickhouse:
        cluster:
          spec:
            settings:
              extraUsersConfig:
                users:
                  ruler:
                    profile: default
                    grants:
                      - query: "GRANT ALL ON alert_state.*"
                      - query: "GRANT SELECT, INSERT ON default.*"
                      - "GRANT SELECT ON system.*"
    asserts:
      - equal:
          path: spec.settings.extraUsersConfig.users.ruler.grants
          value:
            query:
              - "GRANT ALL ON alert_state.*"
              - "GRANT SELECT, INSERT ON default.*"
              - "GRANT SELECT ON system.*"

  - it: should leave grants already written as a query list unchanged
    set:
      clickhouse:
        cluster:
          spec:
            settings:
              extraUsersConfig:
                users:
                  ruler:
                    grants:
                      query:
                        - "GRANT SELECT ON default.*"
    asserts:
      - equal:
          path: spec.settings.extraUsersConfig.users.ruler.grants
          value:
            query:
              - "GRANT SELECT ON default.*"

  - it: should render a list of grants when PromQL is disabled
    set:
      clickstack:
        promql:
          enabled: false
    asserts:
      - equal:
          path: spec.settings.extraUsersConfig.users.otelcollector.grants.query[0]
          value: "GRANT SELECT,INSERT,CREATE,SHOW ON default.*"

  - it: should fail on a grants entry with no query
    set:
      clickhouse:
        cluster:
          spec:
            settings:
              extraUsersConfig:
                users:
                  ruler:
                    grants:
                      - privilege: SELECT
    asserts:
      - failedTemplate:
          errorMessage: 'clickhouse user "ruler": each grants entry must be a query string or a map with a query key'


  - it: should flatten a grants entry whose query is a list
    set:
      clickhouse:
        cluster:
          spec:
            settings:
              extraUsersConfig:
                users:
                  ruler:
                    grants:
                      - query: ["GRANT SELECT ON default.*", "GRANT SELECT ON system.*"]
                      - "GRANT INSERT ON default.*"
    asserts:
      - equal:
          path: spec.settings.extraUsersConfig.users.ruler.grants.query
          value:
            - "GRANT SELECT ON default.*"
            - "GRANT SELECT ON system.*"
            - "GRANT INSERT ON default.*"

  # An empty query block makes ClickHouse reject the whole users config.
  - it: should leave an empty grants list unchanged
    set:
      clickhouse:
        cluster:
          spec:
            settings:
              extraUsersConfig:
                users:
                  ruler:
                    grants: []
    asserts:
      - equal:
          path: spec.settings.extraUsersConfig.users.ruler.grants
          value: []
