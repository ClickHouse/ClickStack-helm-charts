      - failedTemplate:
          errorPattern: "- mongodb\\.password: use\\ hyperdx\\.secrets\\.MONGODB_PASSWORD(\n|$)"
      - failedTemplate:
          errorPattern: "- mongodb\\.image: configure\\ the\\ MongoDBCommunity\\ resource\\ under\\ mongodb\\.spec(\n|$)"
      - failedTemplate:
          errorPattern: "- mongodb\\.port: configure\\ the\\ MongoDBCommunity\\ resource\\ under\\ mongodb\\.spec(\n|$)"
      - failedTemplate:
          errorPattern: "- mongodb\\.strategy: configure\\ the\\ MongoDBCommunity\\ resource\\ under\\ mongodb\\.spec(\n|$)"
      - failedTemplate:
          errorPattern: "- mongodb\\.nodeSelector: configure\\ the\\ MongoDBCommunity\\ resource\\ under\\ mongodb\\.spec(\n|$)"
      - failedTemplate:
          errorPattern: "- mongodb\\.tolerations: configure\\ the\\ MongoDBCommunity\\ resource\\ under\\ mongodb\\.spec(\n|$)"
      - failedTemplate:
          errorPattern: "- mongodb\\.persistence: configure\\ the\\ MongoDBCommunity\\ resource\\ under\\ mongodb\\.spec(\n|$)"
      - failedTemplate:
          errorPattern: "- mongodb\\.livenessProbe: configure\\ the\\ MongoDBCommunity\\ resource\\ under\\ mongodb\\.spec(\n|$)"
      - failedTemplate:
          errorPattern: "- mongodb\\.readinessProbe: configure\\ the\\ MongoDBCommunity\\ resource\\ under\\ mongodb\\.spec(\n|$)"
      - failedTemplate:
          errorPattern: "- clickhouse\\.prometheus\\.endpoint: remove\\ it;\\ only\\ clickhouse\\.prometheus\\.port\\ is\\ read(\n|$)"
      - failedTemplate:
          errorPattern: "- clickhouse\\.config: set\\ ClickHouse\\ credentials\\ in\\ hyperdx\\.secrets\\ \\(CLICKHOUSE_PASSWORD,\\ CLICKHOUSE_APP_PASSWORD\\)(\n|$)"
      - failedTemplate:
          errorPattern: "- clickhouse\\.image: configure\\ the\\ ClickHouseCluster\\ resource\\ under\\ clickhouse\\.cluster\\.spec(\n|$)"
      - failedTemplate:
          errorPattern: "- clickhouse\\.terminationGracePeriodSeconds: configure\\ the\\ ClickHouseCluster\\ resource\\ under\\ clickhouse\\.cluster\\.spec(\n|$)"
      - failedTemplate:
          errorPattern: "- clickhouse\\.resources: configure\\ the\\ ClickHouseCluster\\ resource\\ under\\ clickhouse\\.cluster\\.spec(\n|$)"
      - failedTemplate:
          errorPattern: "- clickhouse\\.livenessProbe: configure\\ the\\ ClickHouseCluster\\ resource\\ under\\ clickhouse\\.cluster\\.spec(\n|$)"
      - failedTemplate:
          errorPattern: "- clickhouse\\.readinessProbe: configure\\ the\\ ClickHouseCluster\\ resource\\ under\\ clickhouse\\.cluster\\.spec(\n|$)"
      - failedTemplate:
          errorPattern: "- clickhouse\\.startupProbe: configure\\ the\\ ClickHouseCluster\\ resource\\ under\\ clickhouse\\.cluster\\.spec(\n|$)"
      - failedTemplate:
          errorPattern: "- clickhouse\\.nodeSelector: configure\\ the\\ ClickHouseCluster\\ resource\\ under\\ clickhouse\\.cluster\\.spec(\n|$)"
      - failedTemplate:
          errorPattern: "- clickhouse\\.tolerations: configure\\ the\\ ClickHouseCluster\\ resource\\ under\\ clickhouse\\.cluster\\.spec(\n|$)"
      - failedTemplate:
          errorPattern: "- clickhouse\\.service: configure\\ the\\ ClickHouseCluster\\ resource\\ under\\ clickhouse\\.cluster\\.spec(\n|$)"
      - failedTemplate:
          errorPattern: "- clickhouse\\.persistence: configure\\ the\\ ClickHouseCluster\\ resource\\ under\\ clickhouse\\.cluster\\.spec(\n|$)"

  - it: should treat a removed key set to null as unset
    set:
      hyperdx:
        replicas: null
    asserts:
      - isKind:
          of: ConfigMap
