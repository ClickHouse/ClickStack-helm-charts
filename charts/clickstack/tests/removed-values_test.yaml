      - failedTemplate:
          errorPattern: "- hyperdx\\.tolerations: use\\ hyperdx\\.deployment\\.tolerations(\n|$)"
      - failedTemplate:
          errorPattern: "- hyperdx\\.annotations: use\\ hyperdx\\.deployment\\.annotations(\n|$)"
      - failedTemplate:
          errorPattern: "- hyperdx\\.labels: use\\ hyperdx\\.deployment\\.labels(\n|$)"
      - failedTemplate:
          errorPattern: "- hyperdx\\.env: use\\ hyperdx\\.deployment\\.env(\n|$)"
      - failedTemplate:
