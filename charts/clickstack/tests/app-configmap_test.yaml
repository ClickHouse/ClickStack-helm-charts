suite: Test ClickStack ConfigMap
templates:
  - hyperdx/configmap.yaml
tests:
  - it: should render clickstack-config ConfigMap with default values
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: clickstack-config
      - equal:
          path: data.HYPERDX_LOG_LEVEL
          value: "info"
      - equal:
          path: data.USAGE_STATS_ENABLED
          value: "true"
      - equal:
          path: data.RUN_SCHEDULED_TASKS_EXTERNALLY
          value: "false"
      - matchRegex:
          path: data.MONGO_URI
          pattern: mongodb://hyperdx:.*@.*-mongodb-svc:27017/hyperdx
      - matchRegex:
          path: data.CLICKHOUSE_ENDPOINT
          pattern: "tcp://.*-clickhouse-clickhouse-headless:9000"
      - matchRegex:
          path: data.OPAMP_SERVER_URL
          pattern: "http://.*-app:4320"

  - it: should disable HyperDX's own telemetry when no browser-reachable endpoint is set
    asserts:
      - equal:
          path: data.HDX_EXPORTER_ENABLED
          value: "false"

  - it: should enable HyperDX's own telemetry when a browser endpoint is set
    set:
      hyperdx:
        config:
          NEXT_PUBLIC_OTEL_EXPORTER_OTLP_ENDPOINT: "https://otel.example.com"
    asserts:
      - equal:
          path: data.HDX_EXPORTER_ENABLED
          value: "true"
      - equal:
          path: data.NEXT_PUBLIC_OTEL_EXPORTER_OTLP_ENDPOINT
          value: "https://otel.example.com"

  - it: should let an explicit HDX_EXPORTER_ENABLED win
    set:
      hyperdx:
        config:
          HDX_EXPORTER_ENABLED: "true"
    asserts:
      - equal:
          path: data.HDX_EXPORTER_ENABLED
          value: "true"

  - it: should fail when the removed 1.x usageStatsEnabled key is set
    set:
      hyperdx:
        usageStatsEnabled: false
    asserts:
      - failedTemplate:
          errorPattern: "hyperdx.usageStatsEnabled: use hyperdx.config.USAGE_STATS_ENABLED"

  - it: should render USAGE_STATS_ENABLED false when opted out
    set:
      hyperdx:
        config:
          USAGE_STATS_ENABLED: false
    asserts:
      - equal:
          path: data.USAGE_STATS_ENABLED
          value: "false"

  - it: should render user-provided config values
    set:
      hyperdx:
        config:
          HYPERDX_LOG_LEVEL: "debug"
          CUSTOM_VAR: "custom-value"
    asserts:
      - equal:
          path: data.HYPERDX_LOG_LEVEL
          value: "debug"
      - equal:
          path: data.CUSTOM_VAR
          value: "custom-value"

  - it: should render FRONTEND_URL from config override
    set:
      hyperdx:
        config:
          FRONTEND_URL: "https://my-domain.com"
    asserts:
      - equal:
          path: data.FRONTEND_URL
          value: "https://my-domain.com"

  - it: should render OTEL_EXPORTER_OTLP_ENDPOINT
    asserts:
      - matchRegex:
          path: data.OTEL_EXPORTER_OTLP_ENDPOINT
          pattern: "http://.*-otel-collector:4318"

  - it: should render the default ClickHouse table TTL
    asserts:
      - equal:
          path: data.HYPERDX_OTEL_EXPORTER_TABLES_TTL
          value: "720h"

  - it: should render per-signal TTL and reconcile overrides from config
    set:
      hyperdx:
        config:
          HYPERDX_OTEL_EXPORTER_LOGS_TTL: "180d"
          HYPERDX_OTEL_EXPORTER_RECONCILE_TABLE_TTL: "true"
    asserts:
      - equal:
          path: data.HYPERDX_OTEL_EXPORTER_LOGS_TTL
          value: "180d"
      - equal:
          path: data.HYPERDX_OTEL_EXPORTER_RECONCILE_TABLE_TTL
          value: "true"
