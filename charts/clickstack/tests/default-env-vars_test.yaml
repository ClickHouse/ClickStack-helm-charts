suite: Test Default Environment Variables
templates:
  - hyperdx/deployment.yaml
tests:
  - it: should add DEFAULT_CONNECTIONS env var when configured with secrets
    set:
      hyperdx:
        deployment:
          env:
            - name: DEFAULT_CONNECTIONS
              valueFrom:
                secretKeyRef:
                  name: hyperdx-connections
                  key: connections-json
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DEFAULT_CONNECTIONS
            valueFrom:
              secretKeyRef:
                name: hyperdx-connections
                key: connections-json

  - it: should add DEFAULT_SOURCES env var when configured with plain value
    set:
      hyperdx:
        deployment:
          env:
            - name: DEFAULT_SOURCES
              value: '[{"name":"HyperDX Logs","kind":"log","connection":"Local ClickHouse"}]'
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DEFAULT_SOURCES
            value: '[{"name":"HyperDX Logs","kind":"log","connection":"Local ClickHouse"}]'

  - it: should add DEFAULT_SOURCES env var when configured with secrets
    set:
      hyperdx:
        deployment:
          env:
            - name: DEFAULT_SOURCES
              valueFrom:
                secretKeyRef:
                  name: hyperdx-sources
                  key: sources-json
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DEFAULT_SOURCES
            valueFrom:
              secretKeyRef:
                name: hyperdx-sources
                key: sources-json

  - it: should add both DEFAULT_CONNECTIONS and DEFAULT_SOURCES when configured
    set:
      hyperdx:
        deployment:
          env:
            - name: DEFAULT_CONNECTIONS
              valueFrom:
                secretKeyRef:
                  name: hyperdx-connections
                  key: connections-json
            - name: DEFAULT_SOURCES
              valueFrom:
                secretKeyRef:
                  name: hyperdx-sources
                  key: sources-json
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DEFAULT_CONNECTIONS
            valueFrom:
              secretKeyRef:
                name: hyperdx-connections
                key: connections-json
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DEFAULT_SOURCES
            valueFrom:
              secretKeyRef:
                name: hyperdx-sources
                key: sources-json

  - it: should include DEFAULT_CONNECTIONS and DEFAULT_SOURCES by default
    asserts:
      - isNotEmpty:
          path: spec.template.spec.containers[0].env[?(@.name=="DEFAULT_CONNECTIONS")]
      - isNotEmpty:
          path: spec.template.spec.containers[0].env[?(@.name=="DEFAULT_SOURCES")]

  - it: should not include DEFAULT_CONNECTIONS when set to empty string
    set:
      hyperdx:
        deployment:
          defaultConnections: ""
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: DEFAULT_CONNECTIONS

  - it: should set span events and links on the default trace source
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].env[?(@.name == "DEFAULT_SOURCES")].value
          pattern: '"kind": "trace",[^}]*"spanEventsValueExpression": "Events"'
      - matchRegex:
          path: spec.template.spec.containers[0].env[?(@.name == "DEFAULT_SOURCES")].value
          pattern: '"kind": "trace",[^}]*"spanLinksValueExpression": "Links"'

  # metricTables keys must match MetricsDataType values; unknown keys
  # (e.g. camelCase "exponentialHistogram") are silently dropped by HyperDX.
  - it: should register all OTel metric tables on the default metric source
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].env[?(@.name == "DEFAULT_SOURCES")].value
          pattern: '"summary": "otel_metrics_summary"'
      - matchRegex:
          path: spec.template.spec.containers[0].env[?(@.name == "DEFAULT_SOURCES")].value
          pattern: '"exponential histogram": "otel_metrics_exponential_histogram"'

  - it: should not include DEFAULT_SOURCES when set to empty string
    set:
      hyperdx:
        deployment:
          defaultSources: ""
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: DEFAULT_SOURCES

  - it: should work with multiline JSON value for DEFAULT_SOURCES
    set:
      hyperdx:
        deployment:
          env:
            - name: DEFAULT_SOURCES
              value: |-
                [
                  {
                    "name": "HyperDX Logs",
                    "kind": "log",
                    "connection": "Local ClickHouse",
                    "from": {
                      "databaseName": "default",
                      "tableName": "logs"
                    }
                  }
                ]
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DEFAULT_SOURCES
            value: |-
              [
                {
                  "name": "HyperDX Logs",
                  "kind": "log",
                  "connection": "Local ClickHouse",
                  "from": {
                    "databaseName": "default",
                    "tableName": "logs"
                  }
                }
              ]
