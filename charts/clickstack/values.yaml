# -- Global defaults applied across chart workloads.
global:
  # -- Optional prefix for container images (e.g. registry.example.com/).
  imageRegistry: ""
  # -- Image pull secrets for private registries. Helps avoid Docker Hub rate limits.
  imagePullSecrets: []

  otelCollector:
    # Custom OTEL Collector configuration, merged on top of the collector's
    # built-in config (works in both OpAMP supervisor and standalone mode).
    # Provide the configuration as a multi-line YAML string. When set, it is
    # rendered into the `clickstack-otel-custom-config` ConfigMap, mounted at
    # /etc/otelcol-contrib/custom/custom.config.yaml, and the
    # CUSTOM_OTELCOL_CONFIG_FILE environment variable points the collector
    # to it. Changing the value automatically restarts the collector pods.
    #
    # NOTE: the OTel confmap merges maps leaf-by-leaf. To override a built-in
    # processor (e.g. memory_limiter), define a new one under a different name
    # and re-declare the pipeline `processors:` lists to reference it.
    #
    # Example:
    # customConfig: |
    #   receivers:
    #     hostmetrics:
    #       collection_interval: 5s
    #       scrapers:
    #         cpu:
    #         load:
    #         memory:
    #   service:
    #     pipelines:
    #       metrics/hostmetrics:
    #         receivers: [hostmetrics]
    #         processors: [memory_limiter, batch]
    #         exporters: [clickhouse]
    customConfig: ""

hyperdx:
  # -- Ports shared across Deployment, Service, ConfigMap, and Ingress.
  ports:
    api: 8000
    app: 3000
    opamp: 4320

  # -- Dashboard provisioning: upserts dashboard JSON into MongoDB (matched by name, never deletes).
  # Provide dashboards inline via configMaps, or label ConfigMaps hyperdx.io/dashboard: "true"
  # for a k8s-sidecar watcher to discover.
  dashboards:
    enabled: false

    # ── Discovery scope ──────────────────────────────────────
    # Namespaces the watcher discovers labeled ConfigMaps in:
    #   []           only the release namespace (a namespaced Role; no cluster-wide access)
    #   [ns-a, ns-b] those namespaces plus the release namespace. A cluster-scoped ClusterRole
    #                rule-template is created, but access stays namespace-scoped — it is bound
    #                only via a RoleBinding in each namespace, never a ClusterRoleBinding.
    #   [ALL]        every namespace cluster-wide (creates a ClusterRole + ClusterRoleBinding)
    # "ALL" is case-sensitive and is exclusive — it cannot be combined with named namespaces.
    # Each listed namespace must already exist at install time: a RoleBinding into a missing
    # namespace is rejected by the API server and fails the whole (atomic) helm install/upgrade.
    # TRUST: within any watched namespace the watcher can read ALL ConfigMaps (the label only
    # filters which are provisioned, not which are readable), and it shares the HyperDX pod's
    # ServiceAccount, so that read grant (cluster-wide under [ALL]) also accrues to the app
    # container. Discovery is also a write path — anyone able to create a labeled ConfigMap in a
    # watched namespace can upsert dashboards into the shared HyperDX. Prefer [ALL] only on
    # single-tenant clusters; a wider scope is a wider blast radius.
    namespaces: []
    rbac:
      # Create the Role/ClusterRole and binding(s) the watcher needs. Set to false to
      # grant access out-of-band (e.g. a RoleBinding applied by each namespace owner).
      create: true

    # Image for the k8s-sidecar that watches for labeled ConfigMaps
    sidecarImage: "kiwigrid/k8s-sidecar:2.10.1"
    sidecarPullPolicy: IfNotPresent
    # Inline dashboard definitions - key is filename, value is exported dashboard JSON
    configMaps: {}
    # Example:
    # configMaps:
    #   k8s-overview.json: |
    #     { "name": "Kubernetes Overview", "tiles": [...] }
    # Sidecar is a lightweight ConfigMap watcher; bump (esp. memory) for very large
    # dashboard sets or wide `namespaces: [ALL]` discovery to avoid OOMKill.
    resources:
      limits:
        cpu: 50m
        memory: 64Mi
      requests:
        cpu: 10m
        memory: 32Mi

  # -- Shared non-sensitive environment variables (clickstack-config ConfigMap).
  # Used by HyperDX and OTEL collector via envFrom. Values support tpl expressions.
  # Override entries with plain strings to point at external services.
  # Changes to the rendered ConfigMap roll the HyperDX Deployment; the otel-collector rolls on every helm upgrade.
  config:
    APP_PORT: "3000"
    API_PORT: "8000"
    HYPERDX_API_PORT: "8000"
    HYPERDX_APP_PORT: "3000"
    HYPERDX_LOG_LEVEL: "info"
    OTEL_SERVICE_NAME: "hdx-oss-api"
    USAGE_STATS_ENABLED: "true"
    OPAMP_PORT: "4320"
    HYPERDX_OTEL_EXPORTER_CLICKHOUSE_DATABASE: "default"
    CLICKHOUSE_USER: "otelcollector"
    RUN_SCHEDULED_TASKS_EXTERNALLY: "false"
    # ClickHouse table retention (TTL). Go-duration string; "d" suffix allowed (e.g. "180d").
    # This global default applies to every signal.
    HYPERDX_OTEL_EXPORTER_TABLES_TTL: "720h"
    # Per-signal overrides (each falls back to HYPERDX_OTEL_EXPORTER_TABLES_TTL when unset),
    # e.g. keep logs & traces longer for compliance while metrics stay short:
    #   HYPERDX_OTEL_EXPORTER_LOGS_TTL: "180d"
    #   HYPERDX_OTEL_EXPORTER_TRACES_TTL: "180d"
    #   HYPERDX_OTEL_EXPORTER_METRICS_TTL: "30d"
    #   HYPERDX_OTEL_EXPORTER_SESSIONS_TTL: "30d"
    # Apply TTL changes to tables that already exist, not just newly created ones (default false):
    #   HYPERDX_OTEL_EXPORTER_RECONCILE_TABLE_TTL: "true"
    # Per-signal TTLs and reconcile need collector image 2.36.0 or newer.
    # Service endpoint defaults -- override to use external instances
    FRONTEND_URL: "http://localhost:3000"
    MONGO_URI: 'mongodb://hyperdx:{{ .Values.hyperdx.secrets.MONGODB_PASSWORD }}@{{ include "clickstack.mongodb.svc" . }}:27017/hyperdx?authSource=hyperdx'
    OTEL_EXPORTER_OTLP_ENDPOINT: 'http://{{ include "clickstack.otel.fullname" . }}:4318'
    # HyperDX's own browser and Next.js server telemetry. Browsers can't reach the in-cluster
    # endpoint above, so this is on only when a browser-reachable collector URL is set:
    #   NEXT_PUBLIC_OTEL_EXPORTER_OTLP_ENDPOINT: "https://otel.example.com"
    HDX_EXPORTER_ENABLED: '{{ if .Values.hyperdx.config.NEXT_PUBLIC_OTEL_EXPORTER_OTLP_ENDPOINT }}true{{ else }}false{{ end }}'
    CLICKHOUSE_ENDPOINT: 'tcp://{{ include "clickstack.clickhouse.svc" . }}:{{ .Values.clickhouse.nativePort }}?dial_timeout=10s'
    CLICKHOUSE_SERVER_ENDPOINT: '{{ include "clickstack.clickhouse.svc" . }}:{{ .Values.clickhouse.nativePort }}'
    CLICKHOUSE_PROMETHEUS_METRICS_ENDPOINT: '{{ include "clickstack.clickhouse.svc" . }}:{{ .Values.clickhouse.prometheus.port }}'
    OPAMP_SERVER_URL: 'http://{{ include "clickstack.hyperdx.fullname" . }}:{{ .Values.hyperdx.ports.opamp }}'

  # -- Shared sensitive environment variables (clickstack-secret).
  # Set to null to skip Secret creation (requires mongodb, clickhouse, and otel-collector disabled).
  # Changes to this Secret roll the HyperDX Deployment; the otel-collector rolls on every helm upgrade.
  # External Secrets need a manual rollout.
  secrets:
    HYPERDX_API_KEY: "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
    CLICKHOUSE_PASSWORD: "otelcollectorpass"
    CLICKHOUSE_APP_PASSWORD: "hyperdx"
    MONGODB_PASSWORD: "hyperdx"

  # -- HyperDX Deployment spec (image, probes, scheduling, init containers, volumes).
  # defaultConnections/defaultSources JSON: set to "" to disable; use useExistingConfigSecret for external secrets.
  deployment:
    image:
      # -- HyperDX container image repository.
      repository: docker.hyperdx.io/hyperdx/hyperdx
      # -- Image tag. Defaults to Chart appVersion when empty.
      tag:
      pullPolicy: IfNotPresent
    # -- Pod replica count. Ignored when hyperdx.autoscaling.enabled is true.
    replicas: 1
    resources: {}
    livenessProbe:
      enabled: true
      path: /health
      initialDelaySeconds: 10
      periodSeconds: 30
      timeoutSeconds: 5
      failureThreshold: 3
    readinessProbe:
      enabled: true
      path: /ready
      initialDelaySeconds: 1
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    nodeSelector: {}
    tolerations: []
    topologySpreadConstraints: []
    priorityClassName: ""
    # Annotations applied to the HyperDX Deployment metadata.
    deploymentAnnotations: {}
    # Annotations applied to the HyperDX pod template metadata.
    # checksum/clickstack-config and checksum/clickstack-secret are reserved for
    # chart-generated rollout checksums and cannot be overridden.
    podAnnotations: {}
    # Deprecated: use podAnnotations. Retained for backward compatibility;
    # podAnnotations takes precedence when both maps contain the same key.
    annotations: {}
    labels: {}
    # Labels applied to the HyperDX pod template metadata.
    podLabels: {}
    # -- Extra environment variables for the HyperDX container, rendered verbatim (supports `valueFrom`, e.g. `secretKeyRef`).
    env: []
    # -- Additional init containers to run before the HyperDX container starts.
    initContainers: []
    # -- Additional volumes to attach to the pod.
    volumes: []
    # -- Additional volume mounts for the HyperDX container.
    volumeMounts: []
    # Pod-level security context for HyperDX workloads.
    podSecurityContext: {}
    # Container-level security context for managed HyperDX containers.
    containerSecurityContext: {}
    waitForMongodb:
      image: "busybox@sha256:1fcf5df59121b92d61e066df1788e8df0cc35623f5d62d9679a41e163b6a0cdb"
      pullPolicy: IfNotPresent
    # -- Load HyperDX connections JSON from an existing Secret instead of defaultConnections.
    useExistingConfigSecret: false
    # -- Secret containing connections and sources JSON when useExistingConfigSecret is true.
    existingConfigSecret: ""
    existingConfigConnectionsKey: "connections.json"
    existingConfigSourcesKey: "sources.json"
    defaultConnections: |
      [
        {
          "name": "Local ClickHouse",
          "host": "http://{{ include "clickstack.clickhouse.svc" . }}:8123",
          "port": 8123,
          "username": "app",
          "password": "{{ .Values.hyperdx.secrets.CLICKHOUSE_APP_PASSWORD }}"
        }
      ]
    defaultSources: |
      [
        {
          "from": {
            "databaseName": "default",
            "tableName": "otel_logs"
          },
          "kind": "log",
          "timestampValueExpression": "Timestamp",
          "name": "Logs",
          "displayedTimestampValueExpression": "Timestamp",
          "implicitColumnExpression": "Body",
          "serviceNameExpression": "ServiceName",
          "bodyExpression": "Body",
          "eventAttributesExpression": "LogAttributes",
          "resourceAttributesExpression": "ResourceAttributes",
          "defaultTableSelectExpression": "Timestamp,ServiceName,SeverityText,Body",
          "severityTextExpression": "SeverityText",
          "traceIdExpression": "TraceId",
          "spanIdExpression": "SpanId",
          "connection": "Local ClickHouse",
          "traceSourceId": "Traces",
          "metricSourceId": "Metrics"
        },
        {
          "from": {
            "databaseName": "default",
            "tableName": "otel_traces"
          },
          "kind": "trace",
          "timestampValueExpression": "Timestamp",
          "name": "Traces",
          "displayedTimestampValueExpression": "Timestamp",
          "implicitColumnExpression": "SpanName",
          "serviceNameExpression": "ServiceName",
          "eventAttributesExpression": "SpanAttributes",
          "resourceAttributesExpression": "ResourceAttributes",
          "defaultTableSelectExpression": "Timestamp,ServiceName,StatusCode,round(Duration/1e6),SpanName",
          "traceIdExpression": "TraceId",
          "spanIdExpression": "SpanId",
          "durationExpression": "Duration",
          "durationPrecision": 9,
          "parentSpanIdExpression": "ParentSpanId",
          "spanNameExpression": "SpanName",
          "spanKindExpression": "SpanKind",
          "statusCodeExpression": "StatusCode",
          "statusMessageExpression": "StatusMessage",
          "spanEventsValueExpression": "Events",
          "spanLinksValueExpression": "Links",
          "connection": "Local ClickHouse",
          "logSourceId": "Logs",
          "sessionSourceId": "Sessions",
          "metricSourceId": "Metrics"
        },
        {
          "from": {
            "databaseName": "default",
            "tableName": ""
          },
          "kind": "metric",
          "timestampValueExpression": "TimeUnix",
          "name": "Metrics",
          "resourceAttributesExpression": "ResourceAttributes",
          "metricTables": {
            "gauge": "otel_metrics_gauge",
            "histogram": "otel_metrics_histogram",
            "sum": "otel_metrics_sum",
            "summary": "otel_metrics_summary",
            "exponential histogram": "otel_metrics_exponential_histogram"
          },
          "connection": "Local ClickHouse",
          "logSourceId": "Logs"
        },
        {
          "from": {
            "databaseName": "default",
            "tableName": "hyperdx_sessions"
          },
          "kind": "session",
          "timestampValueExpression": "TimestampTime",
          "name": "Sessions",
          "resourceAttributesExpression": "ResourceAttributes",
          "connection": "Local ClickHouse",
          "traceSourceId": "Traces"
        }
      ]

  # -- HyperDX Service (ClusterIP by default).
  service:
    type: ClusterIP
    annotations: {}
    # -- Expose the API port (8000) on the Service for API-only or direct API access.
    apiPort:
      enabled: false

  # -- Ingress for HyperDX. annotations and spec are rendered verbatim (nginx, ALB, Traefik, etc.).
  # Use additionalIngresses for multi-ingress setups (e.g. separate OTEL collector ingress).
  ingress:
    enabled: false
    annotations: {}
    spec: {}
    additionalIngresses: []

  # -- PodDisruptionBudget for the HyperDX Deployment. Defaults to maxUnavailable: 1, which never blocks
  # a node drain; set minAvailable or maxUnavailable to override.
  podDisruptionBudget:
    enabled: false

  # -- HorizontalPodAutoscaler for HyperDX. spec is passed through verbatim (autoscaling/v2). Do not include scaleTargetRef — the chart auto-wires it. When enabled, omit deployment.replicas; disabling autoscaling reverts to deployment.replicas (default 1).
  autoscaling:
    enabled: false
    spec: {}

  # -- NetworkPolicy for HyperDX. spec is passed through verbatim.
  networkPolicy:
    enabled: false
    spec: {}

  # -- ServiceAccount for HyperDX. Set create: true to provision one; use annotations for IRSA/GCP bindings.
  serviceAccount:
    create: false
    # -- ServiceAccount name. Defaults to chart fullname when create is true and name is empty.
    name: ""
    annotations: {}

  # -- Scheduled HyperDX background tasks (CronJobs).
  tasks:
    enabled: false
    checkAlerts:
      schedule: "*/1 * * * *"
      additionalArgs: {}
      resources:
        limits:
          cpu: 200m
          memory: 256Mi
        requests:
          cpu: 100m
          memory: 128Mi

# -- In-cluster MongoDB via MongoDBCommunity CR. Set enabled: false for external MongoDB.
mongodb:
  enabled: true
  # -- MongoDBCommunity CRD spec (rendered verbatim). See MongoDB Kubernetes Operator docs.
  spec:
    members: 1
    type: ReplicaSet
    version: "5.0.32"
    security:
      authentication:
        modes: ["SCRAM"]
    users:
      - name: hyperdx
        db: hyperdx
        passwordSecretRef:
          name: '{{ include "clickstack.mongodb.fullname" . }}-password'
        roles:
          - name: dbOwner
            db: hyperdx
          - name: clusterMonitor
            db: admin
        scramCredentialsSecretName: '{{ include "clickstack.mongodb.fullname" . }}-scram'
    additionalMongodConfig:
      storage.wiredTiger.engineConfig.journalCompressor: zlib

# -- In-cluster ClickHouse via ClickHouseCluster CR. Set enabled: false for external ClickHouse.
clickhouse:
  enabled: true
  # -- HTTP interface port for in-cluster connections.
  port: 8123
  # -- Native TCP port used in connection strings.
  nativePort: 9000
  prometheus:
    # -- Expose ClickHouse Prometheus metrics endpoint.
    enabled: true
    port: 9363
  # -- KeeperCluster CRD spec (rendered verbatim). See ClickHouse Operator docs.
  keeper:
    spec:
      containerTemplate:
        image:
          repository: clickhouse/clickhouse-keeper
          tag: "26.8.36.3-alpine"
      replicas: 1
      dataVolumeClaimSpec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
  # -- ClickHouseCluster CRD spec (rendered verbatim). See ClickHouse Operator docs.
  cluster:
    spec:
      containerTemplate:
        image:
          repository: clickhouse/clickhouse-server
          tag: "26.8.36.3-alpine"
        resources:
          requests:
            cpu: 500m
            memory: 2Gi
          limits:
            memory: 2Gi
      replicas: 1
      shards: 1
      keeperClusterRef:
        name: '{{ include "clickstack.clickhouse.keeper" . }}'
      dataVolumeClaimSpec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
      settings:
        extraUsersConfig:
          users:
            app:
              password: '{{ .Values.hyperdx.secrets.CLICKHOUSE_APP_PASSWORD }}'
              profile: default
              grants:
                - query: "GRANT SHOW ON *.*, SELECT ON system.*, SELECT ON default.*"
            otelcollector:
              password: '{{ .Values.hyperdx.secrets.CLICKHOUSE_PASSWORD }}'
              profile: default
              grants:
                - query: "GRANT SELECT,INSERT,CREATE,SHOW ON default.*"
        # The operator defaults to level trace with 50 x 1000M log files, written
        # to the data volume. That fills the 10Gi default volume within days.
        logger:
          level: information
          size: 100M
          count: 10
        extraConfig:
          max_connections: 4096
          keep_alive_timeout: 64
          max_concurrent_queries: 100
          # System log tables also live on the data volume. Match the 30 day default the
          # operator applies to new clusters, so older operators and existing clusters get it too.
          query_log:
            ttl: event_date + INTERVAL 30 DAY DELETE
          part_log:
            ttl: event_date + INTERVAL 30 DAY DELETE
          text_log:
            ttl: event_date + INTERVAL 30 DAY DELETE
          metric_log:
            ttl: event_date + INTERVAL 30 DAY DELETE
          asynchronous_metric_log:
            ttl: event_date + INTERVAL 30 DAY DELETE

# -- Additional Kubernetes manifests deployed alongside the chart (supports tpl).
# See docs/ADDITIONAL-MANIFESTS.md for examples.
additionalManifests: []

# -- OpenTelemetry Collector subchart. Set enabled: false to use an external collector.
otel-collector:
  # -- Deploy the bundled OpenTelemetry Collector subchart.
  enabled: true
  mode: deployment
  image:
    repository: docker.clickhouse.com/clickhouse/clickstack-otel-collector
    tag: "2.39.1"
  extraEnvsFrom:
    - configMapRef:
        name: clickstack-config
    - secretRef:
        name: clickstack-secret
  # Roll collector pods when global.otelCollector.customConfig changes.
  # Merges with any user-provided podAnnotations.
  podAnnotations:
    checksum/custom-config: '{{ .Values.global.otelCollector.customConfig | default "" | sha256sum }}'
    # Subchart tpl can't see hyperdx.config/secrets to hash them, so roll on every upgrade.
    # helm template (Argo CD) always renders revision 1; restart the collector manually there.
    rollout/release-revision: '{{ .Release.Revision }}'
  # Mount for the optional custom config ConfigMap rendered from
  # global.otelCollector.customConfig. The volume is marked optional so it is
  # a no-op when no custom config is set.
  # NOTE: if you override extraVolumes/extraVolumeMounts yourself, Helm
  # replaces these lists entirely -- re-include the entries below to keep
  # global.otelCollector.customConfig working.
  extraVolumes:
    - name: custom-config
      configMap:
        name: clickstack-otel-custom-config
        optional: true
  extraVolumeMounts:
    - name: custom-config
      mountPath: /etc/otelcol-contrib/custom
      readOnly: true
  ports:
    otlp:
      enabled: true
      containerPort: 4317
      servicePort: 4317
      protocol: TCP
      appProtocol: grpc
    otlp-http:
      enabled: true
      containerPort: 4318
      servicePort: 4318
      protocol: TCP
    health-check:
      enabled: true
      containerPort: 13133
      servicePort: 13133
      protocol: TCP
    fluentd:
      enabled: true
      containerPort: 24225
      servicePort: 24225
      protocol: TCP
    metrics:
      enabled: true
      containerPort: 8888
      servicePort: 8888
      protocol: TCP
    jaeger-compact:
      enabled: false
    jaeger-thrift:
      enabled: false
    jaeger-grpc:
      enabled: false
    zipkin:
      enabled: false
