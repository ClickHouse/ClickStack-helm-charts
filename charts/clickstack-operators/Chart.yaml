apiVersion: v2
name: clickstack-operators
description: >-
  Operator dependencies for ClickStack. Install this chart before
  installing clickstack/clickstack to ensure CRDs are registered.
home: https://clickhouse.com/docs/use-cases/observability/clickstack
icon: https://raw.githubusercontent.com/hyperdxio/hyperdx/main/packages/app/public/favicons/clickstack/favicon.svg
sources:
  - https://github.com/ClickHouse/ClickStack-helm-charts
keywords:
  - clickstack
  - operator
  - clickhouse
  - mongodb
annotations:
  artifacthub.io/category: monitoring-logging
  artifacthub.io/license: MIT
  artifacthub.io/links: |
    - name: Chart Source
      url: https://github.com/ClickHouse/ClickStack-helm-charts
type: application
version: 1.1.1
appVersion: "1.0.0"
dependencies:
  - name: mongodb-kubernetes
    version: "~1.7.0"
    repository: oci://quay.io/mongodb/helm-charts
    alias: mongodb-operator
  - name: clickhouse-operator-helm
    version: "~0.0.7"
    repository: oci://ghcr.io/clickhouse
    alias: clickhouse-operator
